name: Android Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          cd mobile/bookmywhip
          npm ci
      
      - name: Cache Gradle Wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('mobile/bookmywhip/android/gradle/wrapper/gradle-wrapper.properties') }}
      
      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('mobile/bookmywhip/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-
      
      - name: Make Gradlew Executable
        run: |
          cd mobile/bookmywhip/android
          chmod +x ./gradlew
      
      - name: Create Debug Keystore
        run: |
          cd mobile/bookmywhip/android/app
          keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android
      
      - name: Create .env file
        run: |
          cd mobile/bookmywhip
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
          echo "API_VERSION=${{ secrets.API_VERSION }}" >> .env
          echo "AZURE_MAPS_SUBSCRIPTION_KEY=${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}" >> .env
          echo "STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" >> .env
      
      - name: Build Android App Bundle
        run: |
          cd mobile/bookmywhip/android
          ./gradlew bundleRelease --no-daemon
      
      - name: Build APK
        run: |
          cd mobile/bookmywhip/android
          ./gradlew assembleRelease --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: mobile/bookmywhip/android/app/build/outputs/apk/release/app-release.apk
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v3
        with:
          name: app-bundle
          path: mobile/bookmywhip/android/app/build/outputs/bundle/release/app-release.aab